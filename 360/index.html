<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1,user-scalable=no">
<link rel="icon" type="image/png" sizes="128x128" href="http://v.ico.loc.cc/logo.png">
<title>360</title>
<script>
console.oldLog = console.log;
console.oldError = console.error;
console.oldInfo = console.info;
console.log=function(...args){window.parent.postMessage(["log",pArgs(arguments)],"*");console.oldLog(...args);};
console.error=function(...args){window.parent.postMessage(["err",pArgs(arguments)],"*");console.oldError(...args);};
console.info=function(...args){window.parent.postMessage(["log",pArgs(arguments)],"*");console.oldInfo(...args);};
function pArgs(args){let r="";for(let i=0;i<args.length;i++){r+=typeof args[i]==="object"?JSON.stringify(args[i]):args[i];if(i<args.length-1)r+=",";}return r;}
(function(){function f(e){let t=e.data;switch(t[0]){case"eval":try{console.log(eval(t[1]))}catch(ex){console.log(ex)}}}window.addEventListener("message",f,!1);})();
window.onerror=function(e){console.log(e)};
</script>
<script src=""></script>
<script src="index_files/jquery.min.js"></script>
<style>
html,body{margin:0;padding:0;height:100%}
body.lock{overflow:hidden;position:fixed;width:100%;height:100%}
#viewer{width:100vw;height:100vh;display:none;touch-action:none}
*{margin:0;padding:0}
h1{width:100%;text-align:center;margin-top:10px;font-size:14px;color:#aaa}
.container{width:400px;max-width:90%;height:160px;padding:15px;margin:20px auto 0;border-radius:10px;background:#fff}
.dashboard{width:100%;height:100%;box-sizing:border-box;border:2px solid #ecerec;border-radius:5px;position:relative}
.dashboard #intro,#notSupport{color:#cecece;display:block;text-align:center;line-height:normal;font-size:20px}
#notSupport{display:none}
#dragHint{
    width:100%;
    height:100%;
    border:1px dashed #333333;
    border-radius:6px;
    color:#444;
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
}
[draggable]{-webkit-user-select:none;user-select:none;cursor:pointer}
.btn-box{position:absolute;bottom:8px;left:50%;transform:translateX(-50%)}
#selectBtn{padding:6px 28px;background:#2563eb;color:#fff;border:none;border-radius:4px;pointer-events:none}
#fileInput{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer}
</style>
</head>
<body>
<link rel="stylesheet" href="index_files/photo-sphere-viewer.min.css">
<script src="index_files/three.min.js"></script>
<script src="index_files/browser.min.js"></script>
<script src="index_files/photo-sphere-viewer.min.js"></script>
<div id="viewer"></div>
<div id="intro">
<h1>360全景图</h1>
<div class="container">
<div id="dashboard" class="dashboard">
<div id="dragHint">拖拽全景图到此展示</div>
<div id="notSupport">不支持此文件</div>
<div class="btn-box">
<button id="selectBtn">选择图片</button>
<input type="file" id="fileInput" accept="image/*">
</div>
</div>
</div>
</div>
<script>
function showFileInfo(url){
    $('#viewer').html('').show();
    new PhotoSphereViewer.Viewer({
        container:document.querySelector('#viewer'),
        panorama:url,
        useXmpData:false,
        moveInertia:false
    });
    $('#intro').hide();
    document.body.classList.add('lock');
}
function bindDrag(el){
    el.addEventListener("dragover",e=>{e.preventDefault();e.stopPropagation()});
    el.addEventListener("dragenter",e=>{e.preventDefault();e.stopPropagation()});
    el.addEventListener("drop",e=>{
        e.preventDefault();e.stopPropagation();
        const files=e.dataTransfer.files;
        const fileUrl=URL.createObjectURL(files[0]);
        if(files[0].type.indexOf('image')===0){
            showFileInfo(fileUrl);
        }else{
            $('#fileInfo').hide();$('#intro').hide();$('#notSupport').show();$('#uploaded').hide();
        }
    });
}
bindDrag(document.documentElement);
document.getElementById('fileInput').addEventListener('change',ev=>{
    const file=ev.target.files[0];
    ev.target.value='';
    if(!file)return;
    showFileInfo(URL.createObjectURL(file));
});
</script>
<script>
if(window.parent&&window.parent.parent){
    let h=document.body.clientHeight;
    h=h>180?h:180;h+=50;
    window.parent.parent.postMessage(["resultsFrame",{height:h,slug:"Ck8Kp"}],"*");
}
</script>
</body>
</html>
