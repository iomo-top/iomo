<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1,user-scalable=no">
<link rel="icon" href="https://hao.ico.loc.cc/favicon.ico">
<title>360</title>

<script>
console.oldLog=console.log;console.oldError=console.error;console.oldInfo=console.info;
console.log=(...args)=>window.parent.postMessage(["log",pArgs(args)],"*")||console.oldLog(...args);
console.error=(...args)=>window.parent.postMessage(["err",pArgs(args)],"*")||console.oldError(...args);
console.info=(...args)=>window.parent.postMessage(["log",pArgs(args)],"*")||console.oldInfo(...args);
function pArgs(a){let s="";for(let i=0;i<a.length;i++)s+=typeof a[i]==="object"?JSON.stringify(a[i]):a[i],i<a.length-1&&(s+=",");return s;}
window.addEventListener("message",e=>{let d=e.data;if(d[0]==="eval")try{console.log(eval(d[1]))}catch(ex){console.log(ex)}},!1);
window.onerror=e=>console.log(e);
</script>

<script src=""></script>
<script src="index_files/jquery.min.js"></script>

<style>
html,body{margin:0;padding:0;height:100%}
body.lock{overflow:hidden;position:fixed;width:100%;height:100%}
#viewer{width:100vw;height:100vh;display:none;touch-action:none}
*{margin:0;padding:0}
h1{width:100%;text-align:center;margin-top:10px;font-size:14px;color:#aaa}
.container{width:400px;max-width:90%;height:160px;padding:15px;margin:20px auto 0;border-radius:10px;background:#fff}
.dashboard{width:100%;height:100%;box-sizing:border-box;border:2px solid #ecerec;border-radius:5px;position:relative}
.dashboard #intro{color:#cecece;display:block;text-align:center;line-height:normal;font-size:20px}
#dragHint{width:100%;height:100%;border:1px dashed #333333;border-radius:6px;color:#444;background:transparent;display:flex;align-items:center;justify-content:center}
[draggable]{-webkit-user-select:none;user-select:none;cursor:pointer}
.btn-box{position:absolute;bottom:8px;left:50%;transform:translateX(-50%)}
#selectBtn{padding:6px 28px;background:#2563eb;color:#fff;border:none;border-radius:4px;pointer-events:none}
#fileInput{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer}
#closeBtn{position:fixed;top:15px;right:15px;width:20px;height:20px;border-radius:50%;background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.85);font-size:12px;line-height:18px;text-align:center;z-index:99999;cursor:pointer;display:none;box-sizing:border-box}
#closeBtn:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,0.12)}
</style>

</head>
<body>

<link rel="stylesheet" href="index_files/photo-sphere-viewer.min.css">
<script src="index_files/three.min.js"></script>
<script src="index_files/browser.min.js"></script>
<script src="index_files/photo-sphere-viewer.min.js"></script>

<div id="viewer"></div>
<button id="closeBtn">×</button>

<div id="intro">
<h1>360全景图</h1>
<div class="container">
<div id="dashboard" class="dashboard">
<div id="dragHint">拖拽全景图到此展示</div>
<div class="btn-box">
<button id="selectBtn">选择图片</button>
<input type="file" id="fileInput" accept="image/*">
</div>
</div>
</div>
</div>

<script>
let psvViewer=null;
let currentObjectURL=null;

function isPanorama(w,h){let r=w/h;return r>1.85&&r<2.20;}

function postHeight() {
  let h = document.body.scrollHeight;
  h = h > 180 ? h : 180;
  h += 50;
  if (window.parent && window.parent.parent) {
    window.parent.parent.postMessage(["resultsFrame", { height: h, slug: "Ck8Kp" }], "*");
  }
}

function closeViewer() {
  if (psvViewer) { try { psvViewer.destroy(); } catch(e) { console.log('closeViewer destroy error:', e); } psvViewer = null; }
  if (currentObjectURL) { URL.revokeObjectURL(currentObjectURL); currentObjectURL = null; }
  $('#viewer').hide().html(''); $('#closeBtn').hide(); $('#intro').show(); document.body.classList.remove('lock');
  postHeight();
}

function showFileInfo(url) {
  if (psvViewer) { try { psvViewer.destroy(); } catch(e) { console.log('showFileInfo destroy error:', e); } psvViewer = null; }
  if (currentObjectURL) { URL.revokeObjectURL(currentObjectURL); currentObjectURL = null; }
  currentObjectURL = url;

  $('#viewer').html('').show(); $('#closeBtn').show();
  let img = new Image();
  img.onload = function() {
    if (isPanorama(this.width, this.height)) {
      psvViewer = new PhotoSphereViewer.Viewer({ container: document.querySelector('#viewer'), panorama: url, useXmpData: false, moveInertia: false });
    } else {
      $('#viewer').append('<img src="' + url + '" style="width:100%;height:100%;object-fit:contain;background:#000;">');
    }
    $('#intro').hide(); document.body.classList.add('lock');
    postHeight();
  };
  img.src = url;
}

document.getElementById('closeBtn').addEventListener('click', closeViewer);

function bindDrag(el) {
  el.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
  el.addEventListener('dragenter', e => { e.preventDefault(); e.stopPropagation(); });
  el.addEventListener('drop', e => {
    e.preventDefault(); e.stopPropagation();
    let files = e.dataTransfer.files;
    let f = files && files[0];
    if (f && f.type.indexOf('image') === 0) showFileInfo(URL.createObjectURL(f));
  });
}

bindDrag(document.documentElement);
bindDrag(document.body);

document.getElementById('fileInput').addEventListener('change', ev => {
  let f = ev.target.files[0]; ev.target.value = ''; if (!f) return; showFileInfo(URL.createObjectURL(f));
});

postHeight();
</script>
</body>
</html>
